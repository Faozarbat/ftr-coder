<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Gacha Tim · Gloria Smash</title>
<style>
*{box-sizing:border-box;margin:0}
html{font-size:calc(100vh/45);background:#000}
body{background:#000;color:#fff;font-family:system-ui,Arial,sans-serif;height:100vh;display:flex;flex-direction:column;gap:.8em;padding:1em 1.4em;overflow:hidden}

.rl{font-size:3.3em;font-weight:900;background:#fff;color:#000;border-radius:.2em;padding:.05em .2em;font-variant-numeric:tabular-nums}

.ok{border-color:#2ee66b}.ok .L{background:#2ee66b;color:#000}.ok .pr{color:#fff}
.on{border-color:#ffd400}.on .L{background:#ffd400;color:#000}
.pop{animation:pop .45s}@keyframes pop{50%{transform:scale(1.1)}}

.ch{font-weight:900;background:#fff;color:#000;padding:.2em .45em;border-radius:.3em;font-variant-numeric:tabular-nums}
.ch.u{background:#000;color:#666;border:.1em solid #444;text-decoration:line-through}

body.r{font-size:16px;padding:14px}body.r #app{display:none}body.r #rem{display:flex}
#rem input{background:#000;color:#fff;border:3px solid #ffd400;border-radius:12px;font-size:22px;padding:10px 14px}

#rs2{min-height:24px;font-weight:800;text-align:center;color:#2ee66b}#rs2.bad{color:#ff3b3b}

#rem button:disabled{background:#333;color:#777}#b1{background:#2ee66b}#rem .rb.stop{background:#ff3b3b;color:#fff}#rem .w{background:#fff}
</style></head><body>
<div id="app" style="display:contents">
<header>
 <div class="ttl" id="ttl">PEMBENTUKAN TIM · GLORIA SMASH</div>
 <div class="cnt"><button id="mn">−</button><div><span id="nn">28</span></div><button id="pl">+</button><div><small>PESERTA</small><small id="tmn"></small></div></div>

<div id="warn"></div>

 <div class="stage"><div id="lb">TIM A</div><div class="reels"><div class="rl" id="r1">---</div><div class="vs">&amp;</div><div class="rl" id="r2">---</div></div><button id="go">▶ PLAY</button><div class="sm"><button id="un">↺ ULANG TERAKHIR</button><button id="rs">RESET SEMUA</button></div></div>

</div>

<button id="b6" class="w" style="padding:18px;font-size:22px;border-radius:16px">BRACKET ▶</button></div>
<div id="rp2"><button class="rb w" id="b7">◀ KEMBALI KE PANEL</button></div></div>
<script>

 $('#cp').innerHTML=[...Array(n)].map((_,i)=>`<span class="ch${u.has(i+1)?' u':''}">${pad(i+1)}</span>`).join('');

function pick(){const p=pool(),a=p[Math.random()*p.length|0];let b;do{b=p[Math.random()*p.length|0]}while(b===a);$('#r1').textContent=pad(a);$('#r2').textContent=pad(b);return[a,b].sort((x,y)=>x-y)}

 clearInterval(iv);iv=0;busy=true;render();const ds=[90,140,210,320,470];let j=0;

 for(let i=p.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[p[i],p[j]]=[p[j],p[i]]}
 const q=[];for(let i=0;i<p.length;i+=2)q.push([p[i],p[i+1]].sort((x,y)=>x-y));
 q.forEach((x,i)=>setTimeout(()=>{$('#r1').textContent=pad(x[0]);$('#r2').textContent=pad(x[1]);if(i===q.length-1)busy=false;put(x)},i*180))}

function resetAll(f){if(busy||iv||locked||!tm.length||view!=='p')return;if(f||confirm('Reset semua hasil gacha tim?')){tm=[];$('#r1').textContent=$('#r2').textContent='---';save();render()}}
function lock(f){if(!(T()>0&&tm.length===T()&&!odd()&&!locked&&!busy&&!iv&&view==='p'))return;if(f||confirm('Kunci hasil? Setelah dikunci tidak bisa diubah tanpa PIN.')){locked=true;save();render();dl()}}
const data=()=>({peserta:n,jumlah_tim:T(),dikunci:locked,disimpan:new Date().toISOString(),tim:tm.map((p,i)=>({tim:A[i],peserta:p.map(pad)}))});
const txt=()=>'GLORIA SMASH · PASANGAN TIM\n'+tm.map((p,i)=>'Tim '+A[i]+': '+pad(p[0])+' & '+pad(p[1])).join('\n');
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data(),null,2)],{type:'application/json'}));a.download='gloria-smash-tim.json';a.click()}
function cpy(){const t=document.createElement('textarea');t.value=txt();document.body.appendChild(t);t.select();try{document.execCommand('copy');alert('Hasil tersalin')}catch(e){alert(txt())}t.remove()}
function show(v){if(iv||busy)return;view=v;document.body.classList.toggle('bv',v==='b');$('#ttl').textContent=v==='b'?'KERANGKA BRACKET · '+T()+' TIM':'PEMBENTUKAN TIM · GLORIA SMASH';if(v==='b')drawB()}
function cfg(t){const M=[],S=[],m=(n,c,y,a,b,k)=>M.push({n,c,y,a,b,k}),u=(n,c,y,a,b)=>m(n,c,y,a,b,G);let lk,id,Y0;
 if(t===14){Y0=560;const L=y=>Y0+y;[70,134,198,262,326,390,454].forEach((y,i)=>u(i+1,0,y,'TIM ?','TIM ?'));
  u(8,1,102,'Menang M1','Menang M2');u(9,1,230,'Menang M3','Menang M4');u(10,1,422,'Menang M6','Menang M7');u(17,2,166,'Menang M8','Menang M9');u(18,2,374,'Menang M10','Menang M5');m(23,3,270,'Menang M17','Menang M18',Y);
  m(11,0,L(70),'Kalah M1','Kalah M2',R);m(12,0,L(134),'Kalah M3','Kalah M4',R);m(13,0,L(198),'Kalah M6','Kalah M7',R);
  m(14,1,L(70),'Menang M11','Kalah M8',R);m(15,1,L(134),'Menang M12','Kalah M9',R);m(16,1,L(262),'Kalah M5','Kalah M10',R);
  m(19,2,L(102),'Menang M14','Menang M15',R);m(20,2,L(230),'Menang M16','Menang M13',R);m(21,3,L(102),'Menang M19','Kalah M17',R);m(22,3,L(230),'Menang M20','Kalah M18',R);
  m(24,4,L(166),'Menang M21','Menang M22',Y);m(25,5,L(166),'Kalah M23','Menang M24',Y);m(26,6,498,'Menang M23','Menang M25',Y);
  S.push([1,326,'BYE · Menang M5'],[0,L(262),'BYE · Kalah M5'],[1,L(198),'BYE · Menang M13']);id=[23,24,25,26];
  lk=[[1,8],[2,8],[3,9],[4,9],[6,10],[7,10],[5,'s0'],['s0',18],[8,17],[9,17],[10,18],[17,23],[18,23],[11,14],[12,15],[13,'s2'],['s2',20],['s1',16],[14,19],[15,19],[16,20],[19,21],[20,22],[21,24],[22,24],[24,25],[23,26],[25,26]]}
 else if(t===16){Y0=620;const L=y=>Y0+y;
  for(let i=0;i<8;i++)u(i+1,0,70+i*64,'TIM ?','TIM ?');
  for(let i=0;i<4;i++){u(9+i,1,102+i*128,'Menang M'+(2*i+1),'Menang M'+(2*i+2));m(13+i,0,L(70+i*64),'Kalah M'+(2*i+1),'Kalah M'+(2*i+2),R);m(17+i,1,L(70+i*64),'Menang M'+(13+i),'Kalah M'+(9+i),R)}
  u(21,2,166,'Menang M9','Menang M10');u(22,2,422,'Menang M11','Menang M12');m(27,3,294,'Menang M21','Menang M22',Y);
  m(23,2,L(102),'Menang M17','Menang M18',R);m(24,2,L(230),'Menang M19','Menang M20',R);m(25,3,L(102),'Menang M23','Kalah M21',R);m(26,3,L(230),'Menang M24','Kalah M22',R);
  m(28,4,L(166),'Menang M25','Menang M26',Y);m(29,5,L(166),'Kalah M27','Menang M28',Y);m(30,6,(294+L(166))/2,'Menang M27','Menang M29',Y);id=[27,28,29,30];
  lk=[[1,9],[2,9],[3,10],[4,10],[5,11],[6,11],[7,12],[8,12],[9,21],[10,21],[11,22],[12,22],[21,27],[22,27],[13,17],[14,18],[15,19],[16,20],[17,23],[18,23],[19,24],[20,24],[23,25],[24,26],[25,28],[26,28],[28,29],[27,30],[29,30]]}
 else return null;return{M,S,lk,id,Y0}}
function drawB(){const t=T(),c=cfg(t),svg=$('#bsv'),msg=$('#bmsg');
 if(!c){svg.style.display='none';msg.textContent='Kerangka bracket baru tersedia untuk 14 tim (28 peserta) dan 16 tim (32 peserta). Sekarang: '+t+' tim.';return}
 svg.style.display='block';msg.textContent='';const CW=218,BW=190,X=k=>12+k*CW,{M,S,lk,id,Y0}=c,L=y=>Y0+y,pos={};
 svg.setAttribute('viewBox','0 0 1530 '+(Y0+400));M.forEach(x=>pos[x.n]=[x.c,x.y]);S.forEach((s,i)=>pos['s'+i]=[s[0],s[1]]);
 let h=lk.map(([a,b])=>{const[c1,y1]=pos[a],[c2,y2]=pos[b],x1=X(c1)+BW,x2=X(c2),xm=(x1+x2)/2;return `<path d="M${x1} ${y1}H${xm}V${y2}H${x2}" fill="none" stroke="#bbb" stroke-width="2.5"/>`}).join('');
 h+=S.map(s=>`<rect x="${X(s[0])}" y="${s[1]-15}" width="${BW}" height="30" rx="8" fill="#000" stroke="${Y}" stroke-width="2.5" stroke-dasharray="6 4"/><text x="${X(s[0])+95}" y="${s[1]+5}" text-anchor="middle" fill="${Y}" font-size="15" font-weight="800">${s[2]}</text>`).join('');
 h+=M.map(x=>{const x0=X(x.c),y0=x.y-26,tt=(s,dy)=>`<text x="${x0+44}" y="${y0+dy}" fill="${s.startsWith('Kalah')?'#ff8a8a':'#fff'}" font-size="17" font-weight="800">${s}</text>`;
  return `<rect x="${x0}" y="${y0}" width="${BW}" height="52" rx="8" fill="#000" stroke="${x.k}" stroke-width="3"/><rect x="${x0}" y="${y0}" width="36" height="52" rx="6" fill="${x.k}"/><text x="${x0+18}" y="${y0+31}" text-anchor="middle" font-size="16" font-weight="800" fill="#000">M${x.n}</text><path d="M${x0+36} ${y0+26}H${x0+BW}" stroke="#555"/>${tt(x.a,22)}${tt(x.b,44)}`}).join('');

  +H(3,top(id[0]),'Upper Final · 5 Des',Y)+H(4,top(id[1]),'Lower Semi · 5 Des',Y)+H(5,top(id[2]),'Lower Final · 5 Des',Y)+H(6,top(id[3]),'Grand Final · 5 Des',Y)

if(REMOTE){document.body.classList.add('r');try{$('#rp').value=localStorage.getItem('gp')||''}catch(e){}
 const ms=(t,b)=>{$('#rs2').textContent=t;$('#rs2').className=b?'bad':''},B={b1:'play',b2:'next',b3:'prev',b4:'reset',b5:'save',b6:'bracket',b7:'back'},Q={b2:'Gacha semua tim sekaligus?',b4:'RESET semua hasil gacha tim?',b5:'SIMPAN dan KUNCI hasil? Tidak bisa diubah tanpa PIN.'};
 function st(j){let i=null;try{i=j.info&&JSON.parse(j.info)}catch(e){}

  $('#rl').textContent=i.o?'Peserta ganjil · atur jumlah di laptop':i.l?'✔ Terkunci · '+i.t+' tim':'Tim terisi '+i.f+' / '+i.t+(i.f<i.t?' · berikutnya Tim '+A[i.f]:'');
  $('#rp1').style.display=i.v==='b'?'none':'flex';$('#rp2').style.display=i.v==='b'?'flex':'none';
  $('#b1').textContent=i.r?'■ STOP':'▶ PLAY';$('#b1').className='rb'+(i.r?' stop':'');
  d('b1',i.o||i.l||(!i.r&&i.f>=i.t));d('b2',i.o||i.l||i.r||i.f>=i.t);d('b3',i.l||i.r||!i.f);d('b4',i.l||i.r||!i.f);d('b5',!(i.f===i.t&&i.t>0&&!i.l&&!i.o&&!i.r));d('b6',i.o)}
 async function cmd(c){const p=$('#rp').value.trim();if(!p)return ms('Isi PIN dulu',1);try{localStorage.setItem('gp',p)}catch(e){}navigator.vibrate&&navigator.vibrate(25);

 setInterval(async()=>{try{const r=await fetch('sync.php?t='+Date.now(),{cache:'no-store'});st(await r.json())}catch(e){}},800)
}else{load();render();

 const C={play:toggle,next:all,prev:undo,reset:()=>resetAll(1),save:()=>lock(1),bracket:()=>show('b'),back:()=>show('p')};let last=null,rk='',pb=0;
