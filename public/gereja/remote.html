<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remote Gloria Smash</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#070d24;color:#dfeaff;font-family:system-ui,sans-serif;user-select:none}
body{display:flex;flex-direction:column;gap:12px;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
#top{display:flex;justify-content:space-between;font-weight:700;font-size:14px;opacity:.85}
#sl{font:800 36px Georgia,serif;color:#f5c451;text-align:center}
.g{flex:1;display:grid;gap:12px;grid-template-columns:1fr 1fr;grid-template-rows:2fr 1.4fr 1fr}
button{border:0;border-radius:22px;font:800 clamp(24px,6vw,40px) system-ui;color:#2a1700;background:linear-gradient(135deg,#ffd978,#e0982b);touch-action:manipulation}
button:active{transform:scale(.97);filter:brightness(1.25)}
#nx,#pl{grid-column:1/3}
#pl{background:linear-gradient(135deg,#8df0ae,#2f9e5a);color:#052b14}
#bk,#rs{background:#ffffff22;color:#fff}
</style></head><body>
<div id="top"><span>Remote Gloria Smash</span><span id="st">...</span></div>
<div id="sl">Slide - / -</div>
<div class="g">
<button id="nx">NEXT ▶</button>
<button id="pl">▶ PLAY / ■ STOP</button>
<button id="bk">◀ Back</button>
<button id="rs">↺ Reset</button>
</div>
<script>
const $=s=>document.querySelector(s);let pin='';
try{pin=localStorage.getItem('pin')||''}catch(e){}
function ok(s){$('#sl').textContent='Slide '+s.slide+' / '+(s.total||'?');$('#st').textContent='● Terhubung'}
async function cmd(c){
  navigator.vibrate&&navigator.vibrate(25);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}
  if(!pin)pin=prompt('PIN remote:')||'';
  try{
    const r=await fetch('sync.php',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({cmd:c,pin})});
    if(r.status===403){pin='';try{localStorage.removeItem('pin')}catch(e){}$('#st').textContent='PIN salah, tekan lagi';return}
    try{localStorage.setItem('pin',pin)}catch(e){}
    ok(await r.json());
  }catch(e){$('#st').textContent='○ Gagal terhubung'}
}
$('#nx').onclick=()=>cmd('next');$('#bk').onclick=()=>cmd('prev');$('#pl').onclick=()=>cmd('play');$('#rs').onclick=()=>cmd('reset');
async function poll(){try{const r=await fetch('sync.php?t='+Date.now(),{cache:'no-store'});ok(await r.json())}catch(e){$('#st').textContent='○ Terputus'}}
setInterval(poll,800);poll();
</script></body></html>
